<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Квизы по Python</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #17243b; background: #f5f7fb; }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100dvh; }
aside { position: sticky; top: 0; height: 100dvh; overflow: auto; padding: 1.5rem 1rem; background: #eaf0fa; }
main { width: min(100%, 820px); margin: 0 auto; padding: 2rem clamp(1rem, 4vw, 3rem); }
h1, h2, p { margin: 0 0 .75rem; }
h1 { font-size: clamp(1.65rem, 5vw, 2.4rem); }
h2 { font-size: 1rem; margin-top: 1.5rem; }
.muted, #status { color: #495970; }
button, textarea { font: inherit; }
button { padding: .55rem .9rem; border: 0; border-radius: .6rem; cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
.primary { background: #244fc0; color: white; font-weight: 600; }
#dialogs button { display: block; width: 100%; text-align: left; margin-bottom: .35rem; color: inherit; background: transparent; overflow-wrap: anywhere; }
#dialogs button:hover, #dialogs [aria-current="true"] { background: #d5e2fb; }
#history { display: grid; gap: .75rem; margin: 1.5rem 0; }
article { overflow-wrap: anywhere; border-radius: .85rem; background: white; padding: .85rem 1rem; }
article.user { white-space: pre-wrap; background: #e3ecff; justify-self: end; max-width: 90%; }
article > strong { display: block; margin-bottom: .3rem; }
.markdown > :last-child { margin-bottom: 0; }
.markdown h2, .markdown h3 { margin: .85rem 0 .4rem; }
.markdown ul, .markdown ol { padding-left: 1.6rem; }
.markdown pre { overflow: auto; padding: .85rem; border-radius: .6rem; background: #17243b; color: #f5f7fb; }
.markdown code { font: .9em ui-monospace, monospace; }
.markdown :not(pre) > code { padding: .1em .3em; border-radius: .25rem; background: #edf2fa; }
.markdown blockquote { margin-left: 0; padding-left: .85rem; border-left: 3px solid #aebcd3; color: #495970; }
.markdown { overflow-x: auto; }
.markdown table { border-collapse: collapse; }
.markdown th, .markdown td { border: 1px solid #cad6e8; padding: .4rem .6rem; }
.markdown th { background: #edf2fa; }
.plain { white-space: pre-wrap; }
a { color: #2149af; }
.sources { margin-top: .65rem; font-size: .9rem; }
form { display: grid; gap: .6rem; justify-items: start; }
textarea { width: 100%; min-height: 5rem; resize: vertical; padding: .8rem; border: 1px solid #aebcd3; border-radius: .75rem; }
#status { min-height: 1.5rem; margin-top: .5rem; }
@media (max-width: 640px) {
  .layout { grid-template-columns: 1fr; }
  aside, main { padding: 1rem; }
  aside { position: static; height: auto; }
  #dialogs { max-height: 9rem; overflow: auto; }
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <button class="primary" id="new-dialog" type="button">+ Новый диалог</button>
    <h2>Диалоги</h2>
    <nav id="dialogs" aria-label="Список диалогов"></nav>
  </aside>
  <main>
    <h1>Квизы по Python</h1>
    <p class="muted">Задайте вопрос по Python или попросите агента составить квиз.</p>
    <section id="history" aria-label="Переписка" aria-live="polite"></section>
    <p id="status" role="status"></p>
    <form>
      <textarea required maxlength="6000" aria-label="Сообщение" placeholder="Создай квиз по циклам на три вопроса"></textarea>
      <button class="primary" id="send">Отправить</button>
    </form>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.0/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
<script>
const ACTIVE_DIALOG_KEY = 'lab3-active-dialog';
const historyPanel = document.querySelector('#history');
const dialogsPanel = document.querySelector('#dialogs');
const newDialog = document.querySelector('#new-dialog');
const form = document.querySelector('form');
const input = form.querySelector('textarea');
const send = document.querySelector('#send');
const status = document.querySelector('#status');
const legacy = JSON.parse(localStorage.getItem('lab3-dialogues') || '{"dialogues":[]}');
const archived = legacy.dialogues.map(dialog => ({...dialog, archived: true}));
const state = {dialogues: archived, active: localStorage.getItem(ACTIVE_DIALOG_KEY) ?? legacy.active};
let busy = false;

function activeDialog() {
  return state.dialogues.find(dialog => dialog.session === state.active);
}

function save() {
  localStorage.setItem(ACTIVE_DIALOG_KEY, state.active ?? '');
}

function addLink(parent, label, url, newTab = false) {
  const link = document.createElement('a');
  link.textContent = label;
  link.href = url;
  if (newTab) {
    link.target = '_blank';
    link.rel = 'noopener';
  }
  parent.append(link);
}

function appendMessage(label, message, result) {
  const article = document.createElement('article');
  if (!result) article.className = 'user';
  const author = document.createElement('strong');
  author.textContent = label;
  article.append(author);
  if (result) {
    const body = document.createElement('div');
    if (window.marked && window.DOMPurify?.isSupported) {
      body.className = 'markdown';
      body.innerHTML = DOMPurify.sanitize(marked.parse(message, {gfm: true}), {
        USE_PROFILES: {html: true},
        FORBID_TAGS: ['img', 'form', 'style'],
        FORBID_ATTR: ['style'],
      });
    } else {
      body.className = 'plain';
      body.textContent = message;
    }
    article.append(body);
    const sources = document.createElement('div');
    sources.className = 'sources';
    if (result.book_pages.length) {
      sources.append('Найдено в учебнике ');
      for (const page of result.book_pages) {
        addLink(sources, 'стр. ' + page.page, page.url, true);
        sources.append(' ');
      }
    }
    if (/^https?:\/\//.test(result.trace_url)) {
      if (sources.hasChildNodes()) sources.append('· ');
      addLink(sources, 'Трейс Langfuse', result.trace_url, true);
    }
    if (sources.hasChildNodes()) article.append(sources);
  } else article.append(message);
  historyPanel.append(article);
}

function render() {
  const active = activeDialog();
  dialogsPanel.replaceChildren();
  for (const dialog of state.dialogues) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = dialog.title;
    button.disabled = busy;
    if (dialog === active) button.setAttribute('aria-current', 'true');
    button.onclick = () => select(dialog.session);
    dialogsPanel.append(button);
  }
  historyPanel.replaceChildren();
  for (const turn of active?.turns || []) {
    appendMessage('Вы', turn.message);
    appendMessage('Агент', turn.result.answer, turn.result);
  }
  if (!active) {
    const hint = document.createElement('p');
    hint.className = 'muted';
    hint.textContent = 'Напишите сообщение, чтобы начать диалог.';
    historyPanel.append(hint);
  }
  newDialog.disabled = busy;
  input.disabled = send.disabled = busy || Boolean(active?.archived);
}

function select(session) {
  state.active = session;
  input.value = '';
  status.textContent = activeDialog()?.archived ? 'Архив старой версии. Здесь можно прочитать переписку.' : '';
  save();
  render();
  if (!input.disabled) input.focus();
}

async function readEvents(response, onEvent) {
  if (!response.ok) throw new Error((await response.json()).detail);
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let pending = '';
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    pending += value;
    const lines = pending.split('\n');
    pending = lines.pop();
    for (const line of lines) {
      const event = JSON.parse(line);
      if (event.kind === 'result') return event.value;
      if (event.kind === 'error') throw new Error(event.value);
      onEvent(event);
    }
  }
  throw new Error('Ответ прервался.');
}

newDialog.onclick = () => select(null);
form.onsubmit = async event => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message || busy || activeDialog()?.archived) return;
  let dialog = activeDialog();
  busy = true;
  render();
  if (!dialog) historyPanel.replaceChildren();
  appendMessage('Вы', message);
  status.textContent = 'Агент работает…';
  status.scrollIntoView({block: 'nearest'});
  const tools = [];
  try {
    const response = await fetch('/api/chat/stream', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session: dialog?.session, message})
    });
    const result = await readEvents(response, ({kind, value}) => {
      if (kind === 'tool') {
        tools.push(value);
      } else if (kind === 'tool_done') {
        const index = tools.indexOf(value);
        if (index !== -1) tools.splice(index, 1);
      }
      status.textContent = tools.length
        ? 'Агент работает · ' + tools.join(', ')
        : 'Агент работает…';
    });
    if (!dialog) {
      dialog = {session: result.session, title: message.slice(0, 70), turns: []};
      state.dialogues.unshift(dialog);
      state.active = dialog.session;
    }
    dialog.turns.push({message, result});
    save();
    input.value = '';
    status.textContent = '';
  } catch (error) {
    status.textContent = error.message;
  } finally {
    busy = false;
    render();
    status.scrollIntoView({block: 'nearest'});
    if (!input.disabled) input.focus({preventScroll: true});
  }
};
async function loadDialogues() {
  busy = true;
  render();
  try {
    const response = await fetch('/api/dialogues');
    if (!response.ok) throw new Error('Не удалось загрузить список диалогов.');
    const saved = await response.json();
    state.dialogues = [...saved, ...archived.filter(dialog =>
      !saved.some(item => item.session === dialog.session))];
    if (activeDialog()?.archived) {
      status.textContent = 'Архив старой версии. Здесь можно прочитать переписку.';
    }
  } catch (error) {
    status.textContent = error.message;
  } finally {
    busy = false;
    render();
  }
}

loadDialogues();
</script>
</body>
</html>
